<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Ankita Pam - Supply Chain Planner and Agentic AI Builder</title>
  <desc id="desc">An animated decision network connects planning signals to optimization and action.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f0f1a"/>
      <stop offset="1" stop-color="#202236"/>
    </linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2d7a6e"/>
      <stop offset="0.52" stop-color="#c8922a"/>
      <stop offset="1" stop-color="#f0c070"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="round">
      <rect x="0" y="0" width="1200" height="320" rx="28"/>
    </clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <circle cx="1040" cy="-30" r="230" fill="#2d7a6e" opacity="0.08"/>
    <circle cx="110" cy="350" r="250" fill="#c8922a" opacity="0.08"/>

    <g fill="none" stroke="url(#flow)" stroke-width="2" opacity="0.78">
      <path d="M86 238 C220 180 304 270 430 216 S660 154 774 218 S1016 270 1120 208" stroke-dasharray="10 12">
        <animate attributeName="stroke-dashoffset" from="0" to="-44" dur="2.2s" repeatCount="indefinite"/>
      </path>
      <path d="M86 238 C236 284 330 148 470 212 S710 284 850 196 S1040 132 1120 208" stroke-dasharray="5 15" opacity="0.55">
        <animate attributeName="stroke-dashoffset" from="0" to="-40" dur="3s" repeatCount="indefinite"/>
      </path>
    </g>

    <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
      <text x="600" y="78" fill="#f0efe9" font-size="46" font-weight="700" letter-spacing="1">ANKITA PAM</text>
      <text x="600" y="116" fill="#f0c070" font-size="20" font-weight="600" letter-spacing="3">PLAN  ·  OPTIMIZE  ·  BUILD</text>
      <text x="600" y="150" fill="#b7b8c5" font-size="17">Supply chain decisions, engineered for the real world</text>
    </g>

    <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle" font-size="13" font-weight="700" letter-spacing="1.5">
      <g transform="translate(86 238)">
        <circle r="10" fill="#2d7a6e" filter="url(#glow)">
          <animate attributeName="r" values="9;13;9" dur="2.4s" repeatCount="indefinite"/>
        </circle>
        <text y="38" fill="#a7d4cd">SIGNALS</text>
      </g>
      <g transform="translate(430 216)">
        <circle r="10" fill="#5b4b8a" filter="url(#glow)">
          <animate attributeName="r" values="9;13;9" dur="2.4s" begin="0.6s" repeatCount="indefinite"/>
        </circle>
        <text y="38" fill="#c9c0e1">SCENARIOS</text>
      </g>
      <g transform="translate(774 218)">
        <circle r="10" fill="#c8922a" filter="url(#glow)">
          <animate attributeName="r" values="9;13;9" dur="2.4s" begin="1.2s" repeatCount="indefinite"/>
        </circle>
        <text y="38" fill="#edc77f">TRADE-OFFS</text>
      </g>
      <g transform="translate(1120 208)">
        <circle r="10" fill="#f0c070" filter="url(#glow)">
          <animate attributeName="r" values="9;13;9" dur="2.4s" begin="1.8s" repeatCount="indefinite"/>
        </circle>
        <text y="38" fill="#f5dda8">ACTION</text>
      </g>
    </g>
  </g>
</svg>
